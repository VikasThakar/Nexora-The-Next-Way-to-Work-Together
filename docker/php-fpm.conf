; Overrides for the default www pool.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker output in the container log rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

clear_env = no
