user  www-data;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 32m;

    # ------------------------------------------------------------------
    # Where nginx spills to disk, and why it is stated explicitly
    # ------------------------------------------------------------------
    #
    # nginx does not hold a whole request in memory. A request body larger than
    # client_body_buffer_size (16k by default) is buffered to a file, and a
    # FastCGI response larger than fastcgi_buffers likewise. Those files go
    # under paths that default, in the Alpine package, to /var/lib/nginx/tmp —
    # a directory the package creates owned by the `nginx` user.
    #
    # The worker processes here run as www-data, because they have to match the
    # php-fpm pool and the application's own file ownership. So with the
    # defaults every spill-to-disk failed with EACCES, and the failure mode was
    # extremely specific: a small JSON POST fits in the buffer and returns 200,
    # while POSTing a file does not and returns 500. That is what made file
    # uploads "disappear" in production and nothing else break — the browser's
    # upload request 500s, and a Livewire upload that 500s leaves no error on
    # the page, just an empty composer.
    #
    # nginx chowns a temp path it creates itself to the configured user, but
    # skips one that already exists — which is exactly why inheriting the
    # package's pre-created directories was silently wrong. These paths are
    # therefore ours: created and chowned in the Dockerfile, so ownership is
    # guaranteed rather than inherited, and a base-image change cannot move
    # them out from under us.
    # Only these two are set, and only because both are certainly in use here:
    # the request body is core nginx, and FastCGI is how every PHP request is
    # served. uwsgi_temp_path and scgi_temp_path are deliberately absent —
    # nothing here speaks either protocol, and an unknown directive from a
    # module a future base image happens not to ship would stop nginx from
    # starting at all. A silent 500 on uploads is bad; a container that will not
    # boot is worse.
    client_body_temp_path /var/cache/nginx/client_body;
    fastcgi_temp_path     /var/cache/nginx/fastcgi;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    server {
        # __PORT__ is replaced by the entrypoint with the platform-supplied
        # $PORT so the container works on Railway and locally unchanged.
        listen __PORT__ default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # TLS is terminated at the platform edge; these are set by the proxy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Hashed Vite assets are immutable.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;

            # Long enough for a streaming AI answer to finish.
            #
            # This is not what bounds an ordinary request: php.ini's
            # max_execution_time (60s) is, and it still does. nginx's read
            # timeout is a backstop for FPM going silent, and it has to exceed
            # the longest legitimate response — the AI assistant streams its
            # answer over a single request and raises its own PHP limit to do
            # so (see config/ai.php stream_time_limit). At 60s here, a slow
            # answer was cut off by the proxy while PHP was still writing it.
            #
            # fastcgi_read_timeout is the gap *between reads*, not the total, so
            # a stream that keeps emitting is never at risk regardless.
            fastcgi_read_timeout 360s;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never execute PHP from anywhere but the front controller.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
