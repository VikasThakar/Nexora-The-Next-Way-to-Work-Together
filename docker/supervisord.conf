[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Attachment reading, and why it is the one worker that lives HERE
; ---------------------------------------------------------------------------
;
; Everything else queued by this application runs on the separate worker
; service. This one cannot, and the reason is the disk rather than the workload.
;
; App\Jobs\ProcessAiAttachment opens the file that was just uploaded. On a
; deployment whose attachment disk is `volume`, those bytes are on a Railway
; volume — and a volume attaches to exactly ONE service. The web service and the
; worker service each have their own, both mounted at /data, so `volume`
; resolves to a different filesystem in each container. The upload request
; writes the file here; a worker over there asks its own /data and finds
; nothing. Worse, a missing object is a legitimate condition in
; App\Services\AI\Attachments\Concerns\ReadsStoredFiles, so the row settles into
; Failed with no exception, no retry and nothing in the log to chase — the card
; simply says the file could not be read.
;
; So the job that needs the file runs where the file is. One process, on its own
; queue (config ai.attachments.queue), consuming nothing else — a PDF parse or a
; transcription must not sit behind a ten-minute AI run, which is the same
; reasoning that gave AI runs their own queue in the first place.
;
; An S3-backed deployment has no such constraint: any worker can read a bucket.
; Leaving this here is still correct and still cheap, and it keeps one deployment
; shape working for both storage choices. To consolidate instead, set
; AI_ATTACHMENTS_QUEUE=default, add it to the worker service's --queue list, and
; remove this program.
;
; --max-time recycles the process hourly so a leaked handle in a parser cannot
; accumulate for the life of the container.
[program:attachment-worker]
command=php /var/www/html/artisan queue:work --queue=attachments --sleep=1 --tries=2 --max-time=3600
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; What is deliberately NOT started here
; ---------------------------------------------------------------------------
;
; This container runs the web service and the attachment worker above. The
; general queue worker, the scheduler and the websocket server each run as their
; own Railway service using the SAME image with a different start command, so
; they scale, restart and fail independently and a stuck job cannot take the
; site down.
;
; 1. QUEUE WORKER  (required — several features silently do nothing without it)
;
;      php artisan queue:work --queue=ai,default --tries=3 --max-time=3600
;
;    `attachments` is deliberately NOT in that list: it is served by the
;    program above, in this container, because that job has to read a file the
;    web service wrote. Adding it here as well would mean two workers racing for
;    the job and the wrong one winning roughly half the time — on a
;    volume-backed disk the loser cannot see the file at all.
;
;    The `ai` queue must be named explicitly, and it is listed FIRST on purpose.
;    AI runs take minutes, so they have their own queue to keep them out of the
;    way of broadcasts and notifications — but a worker started with a bare
;    `queue:work` listens only to `default` and would leave every AI run queued
;    for ever.
;
;    The `default` queue carries broadcasts, in-app notifications, GitHub
;    webhook processing, Slack messages and SMS alerts. Without a worker at all,
;    realtime updates never arrive, no Slack message is posted, no SMS is sent
;    and no pull request is ever linked to a ticket — and nothing errors,
;    because all of it is queued by design.
;
;    If AI runs and realtime start competing for the worker, split them:
;
;      php artisan queue:work --queue=ai      --tries=3 --max-time=3600
;      php artisan queue:work --queue=default --tries=3 --max-time=3600
;
;    An apply-mode worker additionally needs `git` in the image and, if the
;    Claude Code driver is enabled, that binary too. Neither is installed by the
;    Dockerfile because neither is needed by the web service.
;
; 2. SCHEDULER  (optional — housekeeping only)
;
;      php artisan schedule:work
;
;    Prunes webhook deliveries, SMS records (which hold phone numbers, so this
;    is a data-protection obligation rather than tidiness) and failed jobs. The
;    application works without it; it simply accumulates rows.
;
;    Run it on ONE service. On several web replicas it would fire every task
;    once per replica — the tasks carry ->onOneServer(), but that needs a shared
;    cache store (Redis) to mean anything.
;
; 3. REVERB  (optional — realtime)
;
;      php artisan reverb:start --host=0.0.0.0 --port=$PORT
;
;    Deployed from railway.reverb.json. With BROADCAST_CONNECTION=null
;    everything still works; boards, the ticket conversation and the
;    notification bell simply do not refresh by themselves.
;
;    Keep this service at ONE replica. Reverb holds its connections in the
;    memory of the process that accepted them, so a second replica would only
;    deliver an event to the half of the clients that happen to be attached to
;    it. Several replicas need REVERB_SCALING_ENABLED=true and a Redis service
;    for them to share (see config/reverb.php).
;
;    The browser must be able to reach this service directly, so it needs a
;    public domain of its own. REVERB_HOST is that domain, with
;    REVERB_SCHEME=https and REVERB_PORT=443 — while the process itself binds
;    0.0.0.0 on the injected $PORT above.
;
;    VITE_REVERB_* are BUILD arguments, not runtime variables: Vite inlines
;    them into the JS bundle, so changing one requires a rebuild of the web
;    image, not a restart. See the assets stage in the Dockerfile.