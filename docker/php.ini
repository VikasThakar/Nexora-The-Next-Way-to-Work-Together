; Production PHP settings. Mounted as /usr/local/etc/php/conf.d/zz-app.ini so
; it is loaded last and wins over the image defaults.

memory_limit = 256M
max_execution_time = 60

upload_max_filesize = 32M
post_max_size = 34M

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = UTC

; OPcache: the application code never changes inside a running container, so
; timestamp validation is pure overhead.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096k
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.use_strict_mode = 1
