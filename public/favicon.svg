<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aqueduct Workspace">
    <title>Aqueduct Workspace</title>

    <!--
        The same mark as resources/views/components/app/logo.blade.php, with the
        Tailwind class replaced by a literal colour: a favicon is loaded by the
        browser outside the page, so it never sees the stylesheet that defines
        `fill-brand-600`.

        #2A65E8 is `oklch(0.55 0.208 263)` converted to sRGB. If the brand colour
        in resources/css/app.css ever changes, this file and the two generated
        bitmaps beside it have to be regenerated — see the note in the layout.
    -->
    <rect width="32" height="32" rx="8" fill="#2A65E8" />
    <path d="M8 21.5 13.2 10h2.2l5.2 11.5h-2.4l-1.1-2.6h-5.6l-1.1 2.6H8Zm4.4-4.5h4l-2-4.7-2 4.7Z" fill="#fff" />
    <path d="M22 21.5V10h2.2v11.5H22Z" fill="#fff" fill-opacity="0.6" />
</svg>
